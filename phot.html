
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài phốt</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f0f2f5;
      font-family: Arial, sans-serif;
    }

    .post {
      width: 100%;
      max-width: 550px;
      padding: 22px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      text-align: left;
      line-height: 1.7;
    }

    .post-title {
      font-size: 19px;
      font-weight: bold;
      margin: 0 0 15px;
      color: #222;
    }

    .post-content {
      font-size: 15px;
      color: #333;
    }

    .more-text {
      display: none;
    }

    .more-btn {
      display: inline-block;
      margin-top: 8px;
      color: #1877f2;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .more-btn:hover {
      text-decoration: underline;
    }
    .image-center {
    display: flex;
    justify-content: center;
    margin: 15px 0;
  }

  .image-center img {
    display: block;
    max-width: 100%;
    width: 100%;
    height: auto;
    object-fit: cover;
    border-radius: 8px;
  }
  </style>
</head>

<body>

  <div class="post">
    <h2 class="post-title">
      📢 PHỐT MỘT THANH NIÊN CÓ HÀNH VI GẠ GẪM,
      LIÊN TỤC ĐỀ CẬP ĐẾN CHUYỆN QUAN HỆ TÌNH DỤC
      VỚI NHIỀU CÔ GÁI – MỌI NGƯỜI NÊN CẨN THẬN!
    </h2>

    <div class="post-content">
      <span>
        <div class="post-content">
            Mình viết bài này không phải để kiếm chuyện hay cố tình hạ thấp bất kỳ ai, mà là để<a href="https://www.facebook.com/tran.lam.929925" class="read-more">
                ...Xem thêm
              </a>
              <div class="image-center">
                <img
                  src="1.png"
                  alt="Ảnh minh họa bài viết"
                >
          
            
          </div> 
      </span>
  </div>

  

</body>
</html>
